<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>إدارة المنتجات | مصنع صهيب الحريري</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff9900;
      --primary-hover: #e08800;
      --bg: #121212;
      --card-bg: #1e1e1e;
      --input-bg: #282828;
      --text: #f0f0f0;
      --muted: #888;
      --border: #333;
      --danger: #ff4d4d;
      --success: #4CAF50;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 520px; }

    /* شاشة القفل */
    #lockScreen {
      position: fixed; inset: 0; background: #121212; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    .lock-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
      padding: 26px 20px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .pin-box {
      width: 100%; padding: 14px; text-align: center; font-size: 1.6rem; letter-spacing: 6px;
      background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: #fff;
      outline: none; margin: 15px 0;
    }

    /* الشريط العلوي */
    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border);
    }
    .header-title {
      font-family: 'Cairo', sans-serif; font-weight: 800; color: var(--primary); font-size: 1.1rem;
    }
    .btn-logout {
      background: transparent; border: 1px solid var(--danger); color: var(--danger);
      padding: 6px 12px; border-radius: 6px; font-size: 0.82rem; font-weight: bold; cursor: pointer;
    }

    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; border: 1px solid var(--border); }
    .sub-mode { display: flex; gap: 8px; margin-bottom: 15px; background: #252525; padding: 4px; border-radius: 8px; }
    .sub-mode button {
      flex: 1; padding: 9px; border: none; background: transparent; color: #aaa;
      border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 700;
    }
    .sub-mode button.active { background: #383838; color: var(--primary); font-weight: bold; }

    .form-group { margin-bottom: 12px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    label { display: block; font-size: 0.82rem; color: #bbb; margin-bottom: 5px; font-weight: 600; }
    input, select {
      width: 100%; padding: 10px 12px; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none;
    }
    input:focus, select:focus { border-color: var(--primary); }

    .upload-box {
      border: 1px dashed var(--primary); padding: 12px; text-align: center;
      border-radius: 8px; cursor: pointer; color: var(--primary); font-size: 0.88rem; display: block; font-weight: bold;
    }
    .img-preview { width: 100%; max-height: 150px; object-fit: contain; background: #181818; border-radius: 8px; margin-top: 8px; display: none; }

    .submit-btn {
      width: 100%; padding: 13px; background: var(--primary); color: #000; border: none;
      border-radius: 8px; font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 1rem;
      cursor: pointer; margin-top: 10px; transition: 0.2s;
    }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { text-align: center; margin-top: 10px; font-size: 0.88rem; font-weight: bold; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- شاشة تسجيل الدخول بالرمز -->
<div id="lockScreen">
  <div class="lock-card">
    <h3 style="font-family:'Cairo'; font-weight:800; color: var(--primary); margin-bottom: 4px;">إدارة أصناف الحريري</h3>
    <p style="font-size: 0.82rem; color: var(--muted);">أدخل رمز PIN لتسجيل الدخول</p>
    <form id="pinForm" onsubmit="handleLogin(event)">
      <input type="password" id="pinInput" class="pin-box" placeholder="••••" maxlength="8" inputmode="numeric" required autofocus>
      <button type="submit" id="loginBtn" class="submit-btn">تسجيل الدخول</button>
    </form>
    <div id="pinError" style="color: var(--danger); font-size: 0.85rem; margin-top: 10px;"></div>
  </div>
</div>

<!-- محتوى لوحة التحكم -->
<div class="container" id="adminContent">
  <div class="header-bar">
    <div class="header-title">⚙️ إدارة منتجات المصنع</div>
    <button class="btn-logout" onclick="logout()">خروج 🚪</button>
  </div>

  <div class="card">
    <div class="sub-mode">
      <button id="modeEdit" class="active" onclick="setMode('edit')">✏️ تعديل صنف</button>
      <button id="modeAdd" onclick="setMode('add')">➕ إضافة صنف جديد</button>
    </div>

    <form id="productForm">
      <!-- اختيار صنف للتعديل -->
      <div id="selectProductGroup" class="form-group">
        <label>اختر المنتج المراد تعديله:</label>
        <select id="productSelect" onchange="onProductSelectChange()">
          <option value="">-- جاري تحميل الأصناف... --</option>
        </select>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>كود المنتج (ID) *</label>
          <input type="text" id="pId" required placeholder="مثلاً: pvc-p2-46030">
        </div>
        <div class="form-group">
          <label>القسم / النوع *</label>
          <input list="typeList" id="pType" required placeholder="PPR, PVC, كهرباء...">
          <datalist id="typeList">
            <option value="PPR">
            <option value="PVC">
            <option value="كهرباء">
            <option value="زراعي">
            <option value="نحاسيات">
          </datalist>
        </div>
      </div>

      <div class="form-group">
        <label>اسم المنتج *</label>
        <input type="text" id="pName" required placeholder="مثال: بوري، كوع، سكر...">
      </div>

      <div class="grid-3">
        <div class="form-group">
          <label>القياس *</label>
          <input type="text" id="pSize" required placeholder="مثال: 2، 3، 1/2">
        </div>
        <div class="form-group">
          <label>السماكة</label>
          <input type="text" id="pThick" placeholder="مثال: 1.8، PN20">
        </div>
        <div class="form-group">
          <label>وحدة القياس</label>
          <input list="unitList" id="pUnit" placeholder="مم، قطعة، إنش...">
          <datalist id="unitList">
            <option value="مم">
            <option value="إنش">
            <option value="قطعة">
            <option value="متر">
          </datalist>
        </div>
      </div>

      <div class="grid-3">
        <div class="form-group">
          <label>السعر الأصلي ($) *</label>
          <input type="number" step="0.001" id="pPrice" required placeholder="1.75">
        </div>
        <div class="form-group">
          <label>السعر بعد الحسم ($) *</label>
          <input type="number" step="0.001" id="pDiscountPrice" required placeholder="1.75">
        </div>
        <div class="form-group">
          <label>حالة التوفر *</label>
          <select id="pAvailable">
            <option value="متوفر">متوفر ✅</option>
            <option value="غير متوفر">غير متوفر ❌</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>صورة المنتج</label>
        <label for="pImgFile" class="upload-box">📷 اختيار صورة جديدة من الجهاز</label>
        <input type="file" id="pImgFile" accept="image/*" style="display:none;" onchange="previewImg(this)">
        <img id="pPreview" class="img-preview" alt="معاينة">
      </div>

      <button type="submit" id="pSubmitBtn" class="submit-btn">حفظ التعديلات</button>
      <div id="pStatus" class="status"></div>
    </form>
  </div>
</div>

<script>
  // رابط Google Apps Script الخاص بك
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz7O5VbKtGpuZg1CQu4I2O4XSOD7khH3klzFRZtoHAXheIyWQVtpDHUEpDKlnrZXDpvzg/exec";
  const CLOUD_NAME = "dvzg70krq";
  const UPLOAD_PRESET = "alnahhas"; // تأكد من اسم الـ Unsigned Preset الخاص بك

  let currentPin = sessionStorage.getItem('auth_pin') || '';
  let allProducts = [];
  let currentMode = 'edit';

  if (currentPin) verifyAndUnlock(currentPin, false);

  async function handleLogin(e) {
    e.preventDefault();
    const pin = document.getElementById('pinInput').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('pinError');
    btn.disabled = true;
    err.textContent = 'جاري التحقق من السيرفر... ⏳';

    const ok = await verifyAndUnlock(pin, true);
    btn.disabled = false;
    if (!ok) {
      err.textContent = 'رمز PIN غير صحيح ❌';
      document.getElementById('pinInput').value = '';
    }
  }

  async function verifyAndUnlock(pin, isManual) {
    try {
      const res = await fetch(`${SCRIPT_URL}?action=verifyPin&pin=${encodeURIComponent(pin)}`);
      const data = await res.json();
      if (data.status === 'success') {
        currentPin = pin;
        sessionStorage.setItem('auth_pin', pin);
        document.getElementById('lockScreen').classList.add('hidden');
        loadAllData();
        return true;
      }
    } catch (e) {}
    if (!isManual) sessionStorage.removeItem('auth_pin');
    return false;
  }

  function logout() {
    sessionStorage.removeItem('auth_pin');
    location.reload();
  }

  async function loadAllData() {
    try {
      const res = await fetch(`${SCRIPT_URL}?action=getProducts`);
      const data = await res.json();
      allProducts = data.data || [];
      populateDropdown();
    } catch (err) {
      console.error("خطأ في جلب البيانات:", err);
    }
  }

  function populateDropdown() {
    const select = document.getElementById('productSelect');
    select.innerHTML = '<option value="">-- اختر صنفاً للتعديل --</option>';
    allProducts.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      const statusBadge = p.available === 'غير متوفر' ? ' [غير متوفر]' : '';
      opt.textContent = `[${p.type}] ${p.name} (${p.size} - ${p.thick || ''}) - $${p.discountPrice || p.price}${statusBadge}`;
      select.appendChild(opt);
    });
  }

  function onProductSelectChange() {
    const id = document.getElementById('productSelect').value;
    const p = allProducts.find(item => item.id == id);
    if (!p) return;

    document.getElementById('pId').value = p.id || '';
    document.getElementById('pType').value = p.type || '';
    document.getElementById('pName').value = p.name || '';
    document.getElementById('pSize').value = p.size || '';
    document.getElementById('pThick').value = p.thick || '';
    document.getElementById('pUnit').value = p.unit || '';
    document.getElementById('pPrice').value = p.price || 0;
    document.getElementById('pDiscountPrice').value = p.discountPrice !== undefined ? p.discountPrice : p.price;
    document.getElementById('pAvailable').value = p.available || 'متوفر';

    const prev = document.getElementById('pPreview');
    if (p.img) {
      prev.src = p.img;
      prev.style.display = 'block';
    } else {
      prev.style.display = 'none';
    }
  }

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('modeEdit').classList.toggle('active', mode === 'edit');
    document.getElementById('modeAdd').classList.toggle('active', mode === 'add');
    document.getElementById('selectProductGroup').classList.toggle('hidden', mode === 'add');
    document.getElementById('pId').readOnly = (mode === 'edit');
    document.getElementById('productForm').reset();
    document.getElementById('pPreview').style.display = 'none';
  }

  function previewImg(input) {
    if (input.files && input.files[0]) {
      const img = document.getElementById('pPreview');
      img.src = URL.createObjectURL(input.files[0]);
      img.style.display = 'block';
    }
  }

  async function uploadToCloudinary(file) {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', UPLOAD_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: fd });
    if (!res.ok) throw new Error('فشل رفع الصورة على Cloudinary');
    const data = await res.json();
    return data.secure_url;
  }

  document.getElementById('productForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('pSubmitBtn');
    const status = document.getElementById('pStatus');
    btn.disabled = true;
    status.style.color = '#ff9900';
    status.textContent = 'جاري الحفظ... ⏳';

    try {
      let imgUrl = '';
      const file = document.getElementById('pImgFile').files[0];
      if (file) {
        status.textContent = 'جاري رفع الصورة إلى Cloudinary... ☁️';
        imgUrl = await uploadToCloudinary(file);
      }

      const payload = {
        pin: currentPin,
        action: currentMode === 'add' ? 'addProduct' : 'updateProduct',
        id: document.getElementById('pId').value,
        type: document.getElementById('pType').value,
        name: document.getElementById('pName').value,
        size: document.getElementById('pSize').value,
        thick: document.getElementById('pThick').value,
        unit: document.getElementById('pUnit').value,
        price: document.getElementById('pPrice').value,
        discountPrice: document.getElementById('pDiscountPrice').value,
        available: document.getElementById('pAvailable').value,
        img: imgUrl || undefined
      };

      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.status === 'success') {
        status.style.color = 'var(--success)';
        status.textContent = '✅ ' + data.message;
        await loadAllData();
      } else {
        throw new Error(data.message);
      }
    } catch (err) {
      status.style.color = 'var(--danger)';
      status.textContent = '❌ خطأ: ' + err.message;
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
